# storm override — story implementation. Sparse: deltas only.
# Written by storm-setup; edit the template in the module repo, then re-run storm-setup.

[workflow]

persistent_facts = [
  "Implement test-first at the story's pre-agreed seams per the storm-tdd skill: load the spec's 'Seams & test points' list before writing any test; red before green, one vertical slice at a time; no test at an unconfirmed seam — if a needed seam isn't on the list, confirm it with the operator before testing.",
]

# Runs after greet, before the dev-story execution contract engages.
activation_steps_append = [
  "Choose the host-specific entry path. Under Polytoken, do all initial story inspection and implementation planning in the shipped `plan` facet: if this workflow was started in another facet and the native `switch_facet` tool is exposed, switch to `plan` before opening the Linear issue. Resolve and read the story issue (or child ticket), published spec, story file, and project context while its state remains Todo; do not call `storm-linear open` yet. Outside Polytoken, preserve the existing sequence: invoke `storm-linear open` now, moving only the issue or child ticket being worked to In Progress; this session owns closing what it opens and never changes a child ticket's parent story issue.",
  "Read grill_on_implement from {project-root}/_bmad/storm/config.yaml and invoke the storm-grilling skill in that mode against the story spec (skip entirely when `off`). In gaps-only mode: probe only what the published spec leaves ambiguous, then get one confirmation of shared understanding. Do not begin implementation until confirmed.",
  "Under Polytoken only, after the pre-flight grill is confirmed, finish the implementation plan in the `plan` facet, record it with `write_plan`, run the required plan review discipline, and call `handoff_plan` for operator approval. This is the only supported plan-to-execute transition: do not call `propose_goal` or attempt a direct facet switch from `plan`. The approved handoff activates the saved-session goal and enters `execute`; once execution resumes, call `read_goal` and verify that the implementation goal is active, then invoke `storm-linear open` before making implementation changes. If no active goal exists, halt before opening the issue and report that Polytoken plan integration must be enabled; if handoff is not approved, leave the issue Todo and do not implement. Outside Polytoken, do not perform this facet/goal branch.",
]

# Fires after the story implementation is complete and status is updated.
on_complete = """
Close out per the storm contract — only after a clean exit (review loop clean
including storm-cross-review and build/full test suite green). Read
`completion_commit_policy` from `{project-root}/_bmad/storm/config.yaml`:

- Under `require-explicit`, require explicit commit authority and a successful
  authorized commit before closing. If authority is absent or denied, leave the
  issue In Progress and report it; never auto-commit.
- Under `allow-without-storm-commit`, a clean verified implementation may close
  without a Storm-created commit, and the completion record must say so.

1. Invoke `storm-linear close`: comment the completion record on the issue
   BEFORE changing state — what shipped, the verification actually run with its
   results, every review finding declined with its reason, anything deferred to
   a named follow-up ticket. Then move the issue to Done.
2. If this was an unsliced story issue, reconcile sprint-status.yaml to `done`
   under the story key. If it was a child ticket, reconcile nothing — and if it
   was the last open child, report that the story is ready to close rather than
   closing the parent yourself.
3. Report: the issue's new state, what you closed versus deliberately left open,
   and any follow-up the work surfaced.

If the exit was NOT clean (review non-converged, tests failing, or a finding
awaiting an operator decision), the issue stays In Progress — say so explicitly
and report the outstanding items instead of closing.
"""
