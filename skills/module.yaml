code: storm
name: "August Storm Harness"
description: "Project harness for August Storm on BMAD: explicit storm-build lifecycle wrapper around unwrapped upstream bmad-build, Linear phase-split source of truth, grilling interviews, cross-model spec/code review panels, tracker drift reconciliation, and a proposal-only harness improvement loop. Requires the BMad Method (bmm) module and an installed, authenticated linear-cli."
module_version: 0.5.1
default_selected: false

module_greeting: >
  August Storm Harness (storm) installed. To finish setup, run the
  storm-setup skill from your agent:

    > use the storm-setup skill

  It installs the storm-build wrapper and writes sparse compatibility facts into
  _bmad/custom/ for the stock BMM workflows (build, sprint-planning,
  retrospective, code-review, correct-course), then verifies each override
  resolves cleanly. Direct bmad-build and deprecated create-story, dev-story,
  and quick-dev names remain unwrapped by Storm and receive no lifecycle hook;
  use storm-build for an explicit route. The module
  requires the BMad Method (bmm) module: _bmad/bmm/config.yaml and a
  sprint-status.yaml from bmad-sprint-planning. Re-run storm-setup after any
  BMAD update (`storm-setup check`) to confirm the wiring still lands. The
  native OpenCode route additionally requires OMO-Slim to be already installed.
  Every route requires `linear-cli` 0.3.27 or later to be installed and authenticated;
  storm does not install, duplicate, vendor, or globally configure either runtime
  or Linear credentials.

# --- Install prompts -------------------------------------------------------

linear_team:
  prompt: "Linear team name that stores this project's epics, stories, and tickets."
  scope: team
  default: "August Storm"
  result: "{value}"

linear_team_key:
  prompt: "Linear team key (issue prefix, e.g. AS)."
  scope: team
  default: "AS"
  result: "{value}"

grill_on_implement:
  prompt:
    - "How thorough should the pre-flight grilling interview be when storm-build implement starts?"
    - "'gaps-only' probes only what the published spec leaves ambiguous; 'full' re-interviews scope end to end."
  scope: user
  default: "gaps-only"
  result: "{value}"
  single-select:
    - value: "full"
      label: "Full - complete grilling interview before any implementation"
    - value: "gaps-only"
      label: "Gaps only - probe ambiguities the spec does not settle, then confirm"
    - value: "off"
      label: "Off - trust the published spec, start implementing"

external_reviewers:
  prompt:
    - "Comma-separated external reviewer CLIs for cross-model review panels outside Polytoken."
    - "Each must be installed and authenticated; unavailable reviewers are skipped with a warning, never a hard failure. Polytoken sessions use polytoken_review_models instead."
  scope: user
  default: "codex"
  result: "{value}"

polytoken_review_models:
  prompt:
    - "Comma-separated Polytoken model references accepted by subagent.model_override; used only when the review runs under Polytoken."
    - "Use a fully qualified model ID such as codex/gpt-5, optionally with Polytoken's <model-id>(<effort-level>) suffix, such as codex/gpt-5(high)."
    - "Effort names are model-specific and must be configured/supported for that model; omitting the suffix uses the model's configured default effort. Outside Polytoken, external_reviewers remains the CLI roster."
  scope: user
  default: ""
  result: "{value}"

review_loop_max_rounds:
  prompt: "Maximum cross-model review rounds before halting and reporting non-convergence to the operator."
  scope: team
  default: "3"
  result: "{value}"

polytoken_team_profile:
  prompt: "Managed Polytoken specialist profile to activate for this project (quality, balanced, economy, or inherit)."
  scope: user
  default: "balanced"
  result: "{value}"

polytoken_role_model_overrides:
  prompt: "Optional comma-separated role=model overrides for managed Polytoken specialists; use exact configured references and never put credentials here."
  scope: user
  default: ""
  result: "{value}"

polytoken_council_models:
  prompt: "Comma-separated exact Polytoken model references for manual Council members; no silent fallback is used."
  scope: user
  default: ""
  result: "{value}"

polytoken_max_parallel_jobs:
  prompt: "Maximum independent Storm specialist jobs the coordinator may run concurrently."
  scope: team
  default: "2"
  result: "{value}"

polytoken_continue_on_idle:
  prompt: "Enable one-shot continuation after safe idle turns? Continuation is disabled by default and stops on uncertainty."
  scope: user
  default: "off"
  result: "{value}"
  single-select:
    - value: "off"
      label: "Off"
    - value: "on"
      label: "On, with bounded stop-hook continuation"
